services:
  broker:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  manager:
    build: ./manager
    ports:
      - "8080:5000"
    depends_on:
      - broker
      - worker
    restart: always
    stop_grace_period: 40s

  worker:
    build: ./worker
    depends_on:
      - broker
    restart: always
    deploy:
      replicas: 3

volumes:
  redis-data:
